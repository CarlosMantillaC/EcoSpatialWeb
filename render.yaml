databases:
  - name: ecospatial-db
    plan: free
    databaseName: ecospatial
    user: ecospatial

services:
  - type: web
    name: ecospatial-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build -w server
    startCommand: node server/dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ecospatial-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: WEBAUTHN_RP_ID
        value: ecospatial-web.onrender.com
      - key: WEBAUTHN_RP_NAME
        value: EcoSpatial Web
      - key: WEBAUTHN_ORIGIN
        value: https://ecospatial-web.onrender.com
      - key: SIMULATOR_ENABLED
        value: "true"
      - key: SIMULATOR_INTERVAL_SECONDS
        value: "15"
      - key: SIMULATOR_VEHICLE_COUNT
        value: "12"

  - type: web
    name: ecospatial-web
    runtime: static
    buildCommand: npm install --include=dev && npm run build -w client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://ecospatial-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
